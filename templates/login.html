{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4> Вход</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="text" name="username" class="form-control mb-2" placeholder="Имя пользователя" required>
                    <input type="password" name="password" class="form-control mb-2" placeholder="Пароль" required>
                    <button type="submit" class="btn btn-success w-100">Войти</button>
                </form>
                <p class="mt-3 text-center"><a href="/register">Нет аккаунта?</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
