{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        {% if book.cover %}
            <img src="{{ book.cover }}" class="img-fluid rounded">
        {% else %}
            <div class="bg-secondary text-white text-center py-5">Нет обложки</div>
        {% endif %}
    </div>
    <div class="col-md-8">
        <h2>{{ book.title }}</h2>
        <h4 class="text-muted">{{ book.authors }}</h4>
        <p>{{ book.description }}</p>
        
        {% if current_user.is_authenticated %}
            <form method="POST" action="{{ url_for('add_to_library') }}">
                <input type="hidden" name="book_google_id" value="{{ book.id }}">
                <input type="hidden" name="book_title" value="{{ book.title }}">
                <input type="hidden" name="book_author" value="{{ book.authors }}">
                <input type="hidden" name="book_cover" value="{{ book.cover }}">
                
                <select name="status" class="form-select mb-2">
                    <option value="want">📌 Хочу прочитать</option>
                    <option value="reading">📖 Читаю</option>
                    <option value="read">✅ Прочитано</option>
                </select>
                
                <button type="submit" class="btn btn-success w-100">Добавить в библиотеку</button>
            </form>
        {% else %}
            <div class="alert alert-info">Войдите, чтобы добавить книгу</div>
        {% endif %}
    </div>
</div>
{% endblock %}
