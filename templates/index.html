{% extends "base.html" %}

{% block content %}
<div class="text-center py-5">
    <h1>Добро пожаловать в Книжный клуб!</h1>
    <p class="lead">Ищите книги, добавляйте в библиотеку, оценивайте и пишите рецензии</p>

    {% if current_user.is_authenticated %}
        <a href="/search" class="btn btn-primary btn-lg">Найти книгу</a>
        <a href="/profile" class="btn btn-outline-secondary btn-lg">Моя библиотека</a>
    {% else %}
        <a href="/register" class="btn btn-primary btn-lg">Начать читать</a>
        <a href="/login" class="btn btn-outline-secondary btn-lg">Войти</a>
    {% endif %}
</div>
{% endblock %}
