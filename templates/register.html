{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4>Регистрация</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <input type="text" name="username" class="form-control mb-2" placeholder="Имя пользователя" required>
                    <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
                    <input type="password" name="password" class="form-control mb-2" placeholder="Пароль" required>
                    <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
                </form>
                <p class="mt-3 text-center"><a href="/login">Уже есть аккаунт?</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
